<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Tumbuh Bersama</title>
    <link rel="stylesheet" href="/project-root/styles/contact.css">
    <link rel="stylesheet" href="/project-root/styles/global.css">
</head>
<body>

<body>
    <div class="topbar">
        <div class="logo">
            <img src="/project-root/assets/images/logo/logo.png" alt="Logo" class="logo-image">
            <a href="index.html">CV Tumbuh Bersama</a>
        </div>

        <div class="menu">
            <a href="../../../index.html">Beranda</a>
            <a href="/project-root/pages/about.html">Tentang Kami</a>
            <a href="/project-root/pages/products.html">Produk</a>
            <a href="/project-root/pages/gallery.html">Galeri</a>
            <a href="/project-root/pages/pricing.html">Harga</a>
            <a href="/project-root/pages/contact.html">Kontak</a>
        </div>
    </div>

    

    <section id="contact">
        <form class="contact-form">
            <h2>Hubungi Kami</h2>
            
            <div class="form-group">
                <label for="name">Nama</label>
                <input type="text" id="name" placeholder="Masukkan nama...">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Masukkan email...">
            </div>

            <div class="form-group">
                <label for="message">Pesan</label>
                <textarea id="message" rows="4" placeholder="Tulis pesan..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Kirim Pesan</button>
        </form>
    </section>


</body>
</html>
